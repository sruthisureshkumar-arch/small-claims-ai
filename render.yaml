# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: small-claims-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: JUDGE_MODEL
        value: gemini-3.1-flash-lite
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: APP_URL
        sync: false   # set to https://<your-service>.onrender.com after first deploy
